[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/knowledge-core",
    "crates/knowledge-crypto",
    "crates/knowledge-markdown",
    "crates/knowledge-vault",
    "crates/knowledge-store",
    "crates/knowledge-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.11"
futures-util = "0.3"
object_store = { version = "0.14.2", features = ["aws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
ipnet = "2.11.0"
pulldown-cmark = "0.13.4"
regex = "1.13.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.18", features = ["serde", "v7"] }
unicode-normalization = "0.1.25"
zeroize = { version = "1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
