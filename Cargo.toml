[workspace]
members = [
    "crates/knowledge-core",
    "crates/knowledge-crypto",
    "crates/knowledge-store",
    "crates/knowledge-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
axum = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.18", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
