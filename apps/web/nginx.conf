server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # SPA URLs and referrers can carry search text or bearer paths. Never use
    # nginx's inherited combined request logger for application navigation.
    access_log off;
    # Even critical per-request errors can include the URI/referrer.
    error_log /dev/null;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location ^~ /invite/ {
        access_log off;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
