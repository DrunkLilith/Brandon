[graph]
all-features = true

[advisories]
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Owner-approved, exact-version desktop dependencies; see docs/dependency-licenses.md.
# Do not add these licenses to the global allow list.
[[licenses.exceptions]]
name = "cssparser"
version = "=0.37.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
version = "=0.7.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
version = "=0.3.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "option-ext"
version = "=0.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
version = "=0.38.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "target-lexicon"
version = "=0.12.16"
allow = ["Apache-2.0 WITH LLVM-exception"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
